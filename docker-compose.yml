services:
  backend:
    image: webreactor-backend:latest
    build:
      context: ./WebReactor.Backend/WebReactor.Backend
      dockerfile: Dockerfile
    ports:
      - "5000:80"
    volumes:
      - ./WebReactor.Backend/WebReactor.Backend/appsettings.json:/app/appsettings.json
    environment:
      - ASPNETCORE_ENVIRONMENT=Production

  frontend:
    image: webreactor-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend